<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 760" role="img" aria-labelledby="title desc">
  <title id="title">How Resolution Rewards work</title>
  <desc id="desc">The result becomes verifiable, a user submits a bonded YES or NO report, and the approved resolver sets the official result. Correct, incorrect, and invalid or canceled outcomes return or forfeit funds according to the rules.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="9" stdDeviation="15" flood-color="#0f172a" flood-opacity=".09"/></filter>
    <linearGradient id="accentGlow" x1="0" y1="0" x2="1" y2="1"><stop class="glowStart" stop-color="#2b350b"/><stop class="glowEnd" offset="1" stop-color="#1f2808"/></linearGradient>
    <style>
      .bg{fill:#181a1f}.card{fill:#22262c;stroke:#3c434c;stroke-width:2}.title{font:800 46px Inter,Arial,sans-serif;fill:#f5f7f9}.subtitle{font:500 19px Inter,Arial,sans-serif;fill:#b8c0ca}.step{font:800 18px Inter,Arial,sans-serif;fill:#f5f7f9}.body{font:500 16px Inter,Arial,sans-serif;fill:#b8c0ca}.small{font:600 14px Inter,Arial,sans-serif}.outTitle{font:800 22px Inter,Arial,sans-serif}.outBody{font:500 16px Inter,Arial,sans-serif;fill:#d5dae0}.line{fill:none;stroke:#8d96a2;stroke-width:5;stroke-linecap:round;stroke-linejoin:round}.arrow{fill:#8d96a2}.icon{fill:none;stroke:#e4e8ed;stroke-width:5;stroke-linecap:round;stroke-linejoin:round}.accent{fill:#cdff00}.accentText{fill:#101419}.yes{fill:#22c55e}.no{fill:#f43f5e}.purple{fill:#7c5cff}.greenText{fill:#b7f36a}.redText{fill:#ff9ca6}.grayText{fill:#e4e8ed}.divider{stroke:#3c434c;stroke-width:2}.purpleBox{fill:#2b2345;stroke:#8b6ce8;stroke-width:2}.purpleText{fill:#c7b8f5}.officialBox{fill:#293311;stroke:#8eae00;stroke-width:2}.officialText{fill:#dfff77}.resolverStroke{stroke:#cdff00}.correctCard{fill:#17301b;stroke:#76b900;stroke-width:2}.correctIcon{fill:#314d20}.correctStroke{stroke:#b7f36a}.wrongCard{fill:#3b1d24;stroke:#fb7185;stroke-width:2}.wrongIcon{fill:#5a2732}.wrongStroke{stroke:#ff9ca6}.invalidCard{fill:#252a31;stroke:#66717f;stroke-width:2}.invalidIcon{fill:#3a414b}
    </style>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path class="arrow" d="M0 0 12 6 0 12z"/></marker>
  </defs>

  <rect class="bg" width="1600" height="760" rx="32"/>
  <text class="title" x="62" y="70">How Resolution Rewards work</text>
  <text class="subtitle" x="62" y="112">Users can report the expected result, but only the approved resolver decides the official outcome.</text>

  <g filter="url(#shadow)">
    <rect class="card" x="60" y="160" width="292" height="540" rx="28"/>
    <rect class="card" x="392" y="160" width="292" height="540" rx="28"/>
    <rect class="card" x="724" y="160" width="322" height="540" rx="28"/>
  </g>

  <path class="line" d="M352 430h40" marker-end="url(#arrow)"/>
  <path class="line" d="M684 430h40" marker-end="url(#arrow)"/>
  <path class="line" d="M1046 430h58M1104 430V239h36" marker-end="url(#arrow)"/>
  <path class="line" d="M1104 430h36" marker-end="url(#arrow)"/>
  <path class="line" d="M1104 430v195h36" marker-end="url(#arrow)"/>

  <!-- Step 1 -->
  <rect x="92" y="196" width="228" height="198" rx="30" fill="url(#accentGlow)"/>
  <path class="icon" d="M142 245h128v102H142zM142 277h128M165 226v40M247 226v40"/>
  <circle cx="262" cy="341" r="31" class="accent"/>
  <path d="m246 341 11 11 22-26" fill="none" stroke="#fff" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="104" cy="450" r="24" class="accent"/><text x="104" y="457" text-anchor="middle" class="step accentText">1</text>
  <text class="step" x="145" y="442">Result becomes</text><text class="step" x="145" y="468">verifiable</text>
  <line class="divider" x1="90" y1="500" x2="322" y2="500"/>
  <path d="M102 542h37v34h-37zM102 552h37M111 535v14M130 535v14" fill="none" stroke="#b8c0ca" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <text class="body" x="156" y="550">Event ends or market</text><text class="body" x="156" y="576">condition is met.</text>

  <!-- Step 2 -->
  <rect x="424" y="196" width="228" height="198" rx="30" fill="url(#accentGlow)"/>
  <rect x="445" y="262" width="88" height="62" rx="31" class="yes"/><text x="489" y="301" text-anchor="middle" class="step" fill="#fff">YES</text>
  <line x1="538" y1="252" x2="538" y2="334" stroke="#aab5c5" stroke-width="2"/>
  <rect x="543" y="262" width="88" height="62" rx="31" class="no"/><text x="587" y="301" text-anchor="middle" class="step" fill="#fff">NO</text>
  <circle cx="436" cy="450" r="24" class="accent"/><text x="436" y="457" text-anchor="middle" class="step accentText">2</text>
  <text class="step" x="477" y="442">User reports</text><text class="step" x="477" y="468">YES or NO</text>
  <line class="divider" x1="422" y1="500" x2="654" y2="500"/>
  <path d="M437 560v-15a18 18 0 0 1 36 0v15M430 560h50v42h-50z" fill="none" stroke="#b8c0ca" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <text class="body" x="497" y="579">Lock 300 USDC bond.</text>
  <rect class="purpleBox" x="420" y="624" width="236" height="52" rx="14"/>
  <circle cx="454" cy="650" r="14" fill="none" stroke="#7c5cff" stroke-width="3"/><text x="454" y="656" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-weight="800" font-size="16" fill="#7c5cff">i</text>
  <text class="small purpleText" x="482" y="656">Bonded signal only</text>

  <!-- Step 3 -->
  <rect x="756" y="196" width="258" height="198" rx="30" fill="url(#accentGlow)"/>
  <path class="icon" d="M885 218c34 20 54 21 75 26v50c0 48-32 75-75 89-43-14-75-41-75-89v-50c21-5 41-6 75-26Z"/>
  <path class="resolverStroke" d="m855 302 20 20 42-48" fill="none" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="768" cy="450" r="24" class="accent"/><text x="768" y="457" text-anchor="middle" class="step accentText">3</text>
  <text class="step" x="809" y="442">Approved resolver</text><text class="step" x="809" y="468">resolves</text>
  <line class="divider" x1="754" y1="500" x2="1016" y2="500"/>
  <path d="M771 538h38v45h-38zM780 550h20M780 561h20M780 572h13" fill="none" stroke="#b8c0ca" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <text class="body" x="829" y="552">Validates rules</text><text class="body" x="829" y="578">and source.</text>
  <rect class="officialBox" x="754" y="624" width="262" height="52" rx="14"/>
  <circle cx="788" cy="650" r="15" class="accent"/><path d="m780 650 6 6 12-14" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round"/>
  <text class="small officialText" x="815" y="656">Sets official result</text>

  <!-- Correct -->
  <g filter="url(#shadow)"><rect class="correctCard" x="1140" y="160" width="400" height="160" rx="24"/></g>
  <circle class="correctIcon" cx="1210" cy="240" r="43"/><path class="correctStroke" d="m1188 240 15 15 30-35" fill="none" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
  <text class="outTitle greenText" x="1274" y="211">Correct report</text>
  <circle cx="1282" cy="246" r="9" fill="#5c9e00"/><path d="m1278 246 3 3 7-8" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round"/>
  <text class="outBody" x="1305" y="252">300 USDC bond returned</text>
  <circle cx="1282" cy="282" r="9" fill="#5c9e00"/><path d="m1278 282 3 3 7-8" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round"/>
  <text class="outBody" x="1305" y="288">Receive displayed reward</text>

  <!-- Incorrect -->
  <g filter="url(#shadow)"><rect class="wrongCard" x="1140" y="340" width="400" height="180" rx="24"/></g>
  <circle class="wrongIcon" cx="1210" cy="430" r="43"/><path class="wrongStroke" d="m1193 413 34 34m0-34-34 34" fill="none" stroke-width="8" stroke-linecap="round"/>
  <text class="outTitle redText" x="1274" y="385">Incorrect report</text>
  <circle cx="1282" cy="420" r="9" fill="#e11d48"/><path d="m1279 417 6 6m0-6-6 6" stroke="#fff" stroke-width="2"/>
  <text class="outBody" x="1305" y="426">Bond forfeited</text>
  <circle cx="1282" cy="456" r="9" fill="#e11d48"/><path d="m1279 453 6 6m0-6-6 6" stroke="#fff" stroke-width="2"/>
  <text class="outBody" x="1305" y="462">Sent to Security Reserve</text>
  <circle cx="1282" cy="492" r="9" fill="#e11d48"/><path d="m1279 489 6 6m0-6-6 6" stroke="#fff" stroke-width="2"/>
  <text class="outBody" x="1305" y="498">No reward</text>

  <!-- Invalid / canceled -->
  <g filter="url(#shadow)"><rect class="invalidCard" x="1140" y="540" width="400" height="160" rx="24"/></g>
  <circle class="invalidIcon" cx="1210" cy="620" r="43"/>
  <path d="M1183 638h54M1210 583v55M1188 591h44M1193 591l-14 30h28zM1227 591l-14 30h28zM1195 638h30" class="icon" stroke-width="4"/>
  <text class="outTitle grayText" x="1274" y="591">Invalid / canceled</text>
  <circle cx="1282" cy="628" r="9" fill="#64748b"/><path d="m1278 628 3 3 7-8" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round"/>
  <text class="outBody" x="1305" y="634">300 USDC bond returned</text>
  <circle cx="1282" cy="664" r="9" fill="#64748b"/><path d="m1278 664 3 3 7-8" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round"/>
  <text class="outBody" x="1305" y="670">No reward</text>
</svg>
